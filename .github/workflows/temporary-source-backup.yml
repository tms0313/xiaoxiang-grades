name: Temporary source backup
on:
  push:
    branches:
      - backup/manual-source-zip-20261126
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          mkdir -p /tmp/xiaoxiang-backup
          cat > /tmp/xiaoxiang-backup/備份說明.txt <<'EOF'
          小象成績管理系統原始碼備份
          Repository: tms0313/xiaoxiang-grades
          Branch snapshot: main
          Commit: 7483f6c8ebd1424cdf4ec836079a9f4a8909854c
          Snapshot date: 2026-11-26
          Contents: tracked project source and configuration files from GitHub main.
          Excludes: .git metadata, dependencies, local environment files, secrets, and live Supabase database contents.
          EOF
          zip -r /tmp/xiaoxiang-backup/xiaoxiang-grades-source-2026-11-26.zip . \
            -x './.git/*' './node_modules/*' './.env' './.env.*' './**/.env' './**/.env.*' './.DS_Store'
          cp /tmp/xiaoxiang-backup/備份說明.txt ./備份說明.txt
          zip -u /tmp/xiaoxiang-backup/xiaoxiang-grades-source-2026-11-26.zip ./備份說明.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxiang-grades-source-2026-11-26
          path: /tmp/xiaoxiang-backup/xiaoxiang-grades-source-2026-11-26.zip
          retention-days: 7
