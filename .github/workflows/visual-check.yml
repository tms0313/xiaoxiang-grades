name: Visual Smoke Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  visual-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test package
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run visual smoke test
        run: npm run test:visual
      - name: Run rendered font-size audit across roles and admin tabs
        env:
          FONT_AUDIT_ADMIN_EMAIL: ${{ secrets.FONT_AUDIT_ADMIN_EMAIL }}
          FONT_AUDIT_ADMIN_PASSWORD: ${{ secrets.FONT_AUDIT_ADMIN_PASSWORD }}
          FONT_AUDIT_SECOND_EMAIL: ${{ secrets.FONT_AUDIT_SECOND_EMAIL }}
          FONT_AUDIT_SECOND_PASSWORD: ${{ secrets.FONT_AUDIT_SECOND_PASSWORD }}
        run: npm run test:font-audit
      - name: Upload screenshots, inventory and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-results
          path: |
            screenshots/
            font-audit/
            playwright-report/
            test-results/
          retention-days: 14
