name: Visual Smoke Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test package
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-overview.js
          node --check app-score-entry.js
          node --check app-parent.js
          node --check app-teacher-dashboard.js
          node --check app-admin-dashboard.js
          node --check app-auth.js
          node --check app-admin-data.js
          node --check app-utils.js
          node --check tests/release-time.unit.cjs
          node --check tests/admin-management.unit.cjs
          node --check tests/parent-initial-password.unit.cjs
          node --check tests/teacher-management.unit.cjs
          node --check tests/admin-reset-parent-password.unit.cjs
          node --check tests/weekly-score-existing-records.unit.cjs
          node --check tests/session-cache-reset.unit.cjs
          node --check tests/weekly-score-entry-sort.unit.cjs
          node --check tests/asset-cache-version.unit.cjs
          node --check app-export.js
          node --check app-students.js
          node --check app-term-exams.js
          node --check app-alumni-mock.js
          node --check app-admin-audit.js
          node --check app-guardians.js
          node --check app-teachers.js
          node --check attendance.js
          node --check app-styles.js
          node --check playwright.config.js
          node --check tests/visual-check.spec.js
          node --check tests/script-loading.spec.js
          node --check tests/font-audit.spec.js
          node --check tests/font-audit-mobile.spec.js
      - name: Run release-time boundary tests
        run: node --test tests/release-time.unit.cjs
      - name: Run admin student save recovery tests
        run: npm run test:admin-management
      - name: Run parent initial password format tests
        run: npm run test:parent-initial-password
      - name: Run teacher management regression tests
        run: npm run test:teacher-management
      - name: Run admin parent password reset authentication tests
        run: npm run test:parent-password-reset
      - name: Run weekly score existing-record lookup tests
        run: npm run test:weekly-score-existing-records
      - name: Run session cache reset regression tests
        run: npm run test:session-cache-reset
      - name: Run weekly score entry sorting tests
        run: npm run test:weekly-score-entry-sort
      - name: Run static asset cache version test
        run: npm run test:asset-cache-version
      - name: Run application script-loading integration test
        run: npm run test:script-loading
      - name: Run visual smoke test
        run: npx playwright test tests/visual-check.spec.js
      - name: Verify typography audit secrets are available (names only)
        id: audit-secrets
        env:
          ADMIN_EMAIL: ${{ secrets.FONT_AUDIT_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.FONT_AUDIT_ADMIN_PASSWORD }}
          PARENT_EMAIL: ${{ secrets.FONT_AUDIT_PARENT_EMAIL }}
          PARENT_PASSWORD: ${{ secrets.FONT_AUDIT_PARENT_PASSWORD }}
          TEACHER_EMAIL: ${{ secrets.FONT_AUDIT_TEACHER_EMAIL }}
          TEACHER_PASSWORD: ${{ secrets.FONT_AUDIT_TEACHER_PASSWORD }}
        run: |
          missing=0
          for name in ADMIN_EMAIL ADMIN_PASSWORD PARENT_EMAIL PARENT_PASSWORD TEACHER_EMAIL TEACHER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret corresponding to ${name}"
              missing=1
            else
              echo "${name}: configured"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Typography audits skipped: configure all six FONT_AUDIT_* repository secrets to enable desktop and mobile role-based audits."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run desktop and mobile rendered font-size audits across roles and admin tabs
        if: steps.audit-secrets.outputs.available == 'true'
        env:
          FONT_AUDIT_ADMIN_EMAIL: ${{ secrets.FONT_AUDIT_ADMIN_EMAIL }}
          FONT_AUDIT_ADMIN_PASSWORD: ${{ secrets.FONT_AUDIT_ADMIN_PASSWORD }}
          FONT_AUDIT_PARENT_EMAIL: ${{ secrets.FONT_AUDIT_PARENT_EMAIL }}
          FONT_AUDIT_PARENT_PASSWORD: ${{ secrets.FONT_AUDIT_PARENT_PASSWORD }}
          FONT_AUDIT_TEACHER_EMAIL: ${{ secrets.FONT_AUDIT_TEACHER_EMAIL }}
          FONT_AUDIT_TEACHER_PASSWORD: ${{ secrets.FONT_AUDIT_TEACHER_PASSWORD }}
        run: npm run test:font-audit
      - name: Upload screenshots, inventory and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-results
          path: |
            screenshots/
            font-audit/
            font-audit-mobile/
            playwright-report/
            test-results/
          retention-days: 14
